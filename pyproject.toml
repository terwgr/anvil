[project]
name = "anvil-gpu-queue"
version = "1.0.0"
description = "Agent-first local GPU queue for macOS"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
anvil = "anvil.cli:main"
anvil-mcp = "anvil.mcp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["anvil"]

[tool.setuptools.package-data]
anvil = ["QUICKSTART.md", "wrap.py", "Anvil.swift"]
